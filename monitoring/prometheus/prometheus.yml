global:
  scrape_interval: 15s

scrape_configs:

  # InfraFlow Application
  - job_name: "infraflow"

    metrics_path: "/actuator/prometheus"

    static_configs:
      - targets:
          - "app:8080"

  # VPS System Metrics
  - job_name: "node"

    static_configs:
      - targets:
          - "node-exporter:9100"