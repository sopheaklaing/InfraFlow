name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw test -B

  security-scan-source:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve Maven dependencies
        run: ./mvnw dependency:resolve -B

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
  # build image
  build-image:
    runs-on: ubuntu-latest
    needs: security-scan-source

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t infraflow:${{ steps.meta.outputs.tag }} \
            .

      - name: Save Docker image
        run: |
          docker save infraflow:${{ steps.meta.outputs.tag }} \
            -o infraflow.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: infraflow-image
          path: infraflow.tar
          retention-days: 1
  # scan image by trivy
  image-scan:
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: infraflow-image
          path: .

      - name: Load Docker image
        run: docker load -i infraflow.tar

      - name: Verify Docker image
        run: |
          docker images
          docker image inspect infraflow:${{ needs.build-image.outputs.image_tag }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: infraflow:${{ needs.build-image.outputs.image_tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

   # push image to GHCR 
  push-image:
    runs-on: ubuntu-latest
    needs: [build-image, image-scan]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: infraflow-image
          path: .

      - name: Load Docker image
        run: docker load -i infraflow.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        run: |
          docker tag \
            infraflow:${{ needs.build-image.outputs.image_tag }} \
            ghcr.io/${{ github.repository_owner }}/infraflow:${{ needs.build-image.outputs.image_tag }}

      - name: Push image to GHCR
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/infraflow:${{ needs.build-image.outputs.image_tag }}