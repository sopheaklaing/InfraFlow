name: CI/CD

on:
  push:
    branches: [main, test/rollback]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw test -B


  security-scan-source:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve Maven dependencies
        run: ./mvnw dependency:resolve -B

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"


  build-image:
    runs-on: ubuntu-latest
    needs: security-scan-source

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t infraflow:${{ steps.meta.outputs.tag }} \
            .

      - name: Save Docker image
        run: |
          docker save infraflow:${{ steps.meta.outputs.tag }} \
            -o infraflow.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: infraflow-image
          path: infraflow.tar
          retention-days: 1


  image-scan:
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: infraflow-image
          path: .

      - name: Load Docker image
        run: docker load -i infraflow.tar

      - name: Verify Docker image
        run: |
          docker images
          docker image inspect infraflow:${{ needs.build-image.outputs.image_tag }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: infraflow:${{ needs.build-image.outputs.image_tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"


  push-image:
    runs-on: ubuntu-latest
    needs: [build-image, image-scan]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: infraflow-image
          path: .

      - name: Load Docker image
        run: docker load -i infraflow.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        run: |
          docker tag \
            infraflow:${{ needs.build-image.outputs.image_tag }} \
            ghcr.io/${{ github.repository_owner }}/infraflow:${{ needs.build-image.outputs.image_tag }}

      - name: Push image to GHCR
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/infraflow:${{ needs.build-image.outputs.image_tag }}


  deploy:
    runs-on: ubuntu-latest
    needs: [build-image, push-image]

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/apps/infraflow

            NEW_TAG=${{ needs.build-image.outputs.image_tag }}
            IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/infraflow

            echo "======================================"
            echo "New version: ${NEW_TAG}"
            echo "======================================"

            # Get currently running version
            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' infraflow)
            OLD_TAG=${OLD_IMAGE##*:}

            echo "Current version: ${OLD_TAG}"

            # Pull new image
            echo "Pulling new image..."
            docker pull ${IMAGE_NAME}:${NEW_TAG}

            # Deploy new version
            echo "Deploying ${NEW_TAG}..."
            export APP_TAG=${NEW_TAG}
            docker compose up -d

            echo "Waiting for application to become healthy..."

            HEALTHY=false

            for i in {1..30}; do
              if curl --fail --silent http://localhost:8080/actuator/health; then
                echo
                echo "Application is healthy!"
                HEALTHY=true
                break
              fi

              echo "Health check failed. Retry $i/30..."
              sleep 2
            done

            # New version failed → rollback
            if [ "$HEALTHY" != "true" ]; then

              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "Failed version: ${NEW_TAG}"
              echo "======================================"

              echo "Failed version logs:"
              docker logs infraflow --tail 100 || true

              echo "======================================"
              echo "Rolling back to ${OLD_TAG}..."
              echo "======================================"

              export APP_TAG=${OLD_TAG}
              docker compose up -d

              echo "Waiting for rollback application..."

              ROLLBACK_HEALTHY=false

              for i in {1..30}; do
                if curl --fail --silent http://localhost:8080/actuator/health; then
                  echo
                  echo "Rollback application is healthy!"
                  ROLLBACK_HEALTHY=true
                  break
                fi

                echo "Rollback health check failed. Retry $i/30..."
                sleep 2
              done

              if [ "$ROLLBACK_HEALTHY" != "true" ]; then
                echo "CRITICAL: Rollback also failed!"
                exit 1
              fi

              echo "======================================"
              echo "ROLLBACK SUCCESSFUL"
              echo "Restored version: ${OLD_TAG}"
              echo "======================================"

              exit 1
            fi

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Running version: ${NEW_TAG}"
            echo "======================================"

            docker ps
